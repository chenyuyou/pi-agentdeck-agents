name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # >= 22.14.0 required by trusted publishing
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm CLI >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: |
          npm install -g npm@latest
          npm --version

      # Skip (do not fail) when the tag does not match package.json — historical
      # tags such as v0.1.0/v0.2.0 must not produce red publish runs.
      - name: Check tag matches package version
        id: check
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tag $TAG does not match package.json ($PKG) — skipping publish"
          fi

      # No NODE_AUTH_TOKEN: npm detects the OIDC environment and authenticates as
      # the trusted publisher configured for this package on npmjs.com.
      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public

      # If trusted publishing is not configured yet, say so instead of failing silently.
      - name: Hint on failure
        if: failure() && steps.check.outputs.skip != 'true'
        run: |
          echo "::warning::npm publish failed. If this is the first release, configure a Trusted Publisher for this package on npmjs.com (Settings → Trusted Publisher → GitHub Actions), or publish once locally with a token."
